<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PicoLearning tests</title>
</head>
<body>
  <pre id="out">Running…</pre>
  <script type="module">
    const out = document.getElementById('out');
    const logs = [];
    const orig = console.log;
    const err = console.error;
    console.log = (...a) => { logs.push(a.join(' ')); orig(...a); };
    console.error = (...a) => { logs.push(a.join(' ')); err(...a); };
    try {
      await import('./run.mjs');
    } catch (e) {
      logs.push(String(e));
    }
    out.textContent = logs.join('\n');
  </script>
</body>
</html>
